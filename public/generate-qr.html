<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generate Live QR | Smart QR Attendance</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        min-height: 100dvh;
        font-family: Arial, sans-serif;
        background: #f5f7fb;
        color: #172033;
    }

    .navbar {
        background: #071b33;
        color: white;
        padding: 16px clamp(16px, 4vw, 30px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: bold;
        font-size: 20px;
    }

    .brand img {
        width: 42px;
        height: 42px;
        object-fit: contain;
        border-radius: 8px;
    }

    .container {
        max-width: 700px;
        margin: 0 auto;
        padding: clamp(16px, 5vh, 45px) 20px;
        padding: clamp(16px, 5dvh, 45px) 20px;
    }

    .card {
        background: white;
        border-radius: 20px;
        padding: clamp(20px, 5vw, 35px);
        text-align: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h1 {
        margin-bottom: 10px;
    }

    .subtitle {
        color: #667085;
        margin-bottom: 25px;
    }

    .timer {
        background: #fff7d6;
        color: #8a6500;
        padding: 12px;
        border-radius: 10px;
        font-weight: bold;
        margin-bottom: 25px;
    }

    #qrImage {
        width: min(300px, 80vw);
        max-width: 100%;
        aspect-ratio: 1;
        object-fit: contain;
        border: 10px solid white;
        box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        margin: 10px auto 25px;
        display: block;
    }

    #qrImage[hidden] {
        display: none;
    }

    .status {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 20px;
    }

    .qr-form {
        display: grid;
        gap: 14px;
        margin: 24px 0;
        text-align: left;
    }

    .qr-form[hidden] {
        display: none;
    }

    .qr-form label {
        display: grid;
        gap: 7px;
        color: #344054;
        font-size: 14px;
        font-weight: bold;
    }

    .qr-form input {
        width: 100%;
        padding: 12px;
        border: 1px solid #d0d5dd;
        border-radius: 9px;
        font: inherit;
    }

    .qr-form button {
        margin-top: 4px;
    }

    button {
        background: #ffc400;
        border: none;
        padding: 14px 25px;
        border-radius: 10px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #eab300;
    }

    .back {
        display: inline-block;
        margin-top: 25px;
        color: #174ea6;
        text-decoration: none;
    }

    .back[hidden] {
        display: none;
    }

    @media (max-width: 550px) {
        .brand {
            gap: 8px;
            font-size: 14px;
        }

        .brand img {
            width: 36px;
            height: 36px;
        }

        .navbar > span {
            font-size: 12px;
        }

        .container {
            width: 100%;
            padding-right: 14px;
            padding-left: 14px;
        }

        .card {
            border-radius: 14px;
        }
    }
</style>
</head>

<body>

<nav class="navbar">
    <div class="brand">
        <img src="images/ATC LOGO.jpeg" alt="ATC Logo">
        <span>ALIET TECHPRENEUR CLUB</span>
    </div>

    <span>LIVE QR</span>
</nav>

<div class="container">

    <div class="card">

        <h1>Generate Live QR</h1>

        <p class="subtitle">
            Scan this QR code to mark attendance
        </p>

        <div class="timer" id="timer">
            Enter a student and event to begin.
        </div>

        <img id="qrImage" alt="Live QR Code" hidden>

        <div class="status" id="status">
            Enter a student and event to generate a QR.
        </div>

        <form class="qr-form" id="qrForm">
            <label for="studentId">
                Student ID
                <input
                    id="studentId"
                    name="studentId"
                    type="text"
                    autocomplete="off"
                    list="studentOptions"
                    placeholder="Select or enter a student ID"
                    required
                >
                <datalist id="studentOptions"></datalist>
            </label>

            <label for="eventId">
                Event ID
                <input
                    id="eventId"
                    name="eventId"
                    type="text"
                    list="eventOptions"
                    placeholder="Select or enter an event ID"
                    required
                >
                <datalist id="eventOptions"></datalist>
            </label>

            <button type="submit">
                Generate QR
            </button>
        </form>

        <br>

        <a class="back" href="/admin-dashboard.html">
            ← Back to Dashboard
        </a>

    </div>

</div>

<script>

let timerInterval;
let currentStudentId = "";
let currentEventId = null;
let generationId = 0;

document.getElementById("qrForm").addEventListener("submit", function (event) {
    event.preventDefault();

    currentStudentId =
        document.getElementById("studentId").value.trim();
    currentEventId =
        document.getElementById("eventId").value.trim();

    generateQR(currentStudentId, currentEventId, false);
});

const qrLinkParams = new URLSearchParams(window.location.search);
const linkedStudentId = qrLinkParams.get("studentId");
const linkedEventId = qrLinkParams.get("eventId");

if (linkedStudentId && linkedEventId) {
    currentStudentId = linkedStudentId.trim();
    currentEventId = linkedEventId.trim();
    document.getElementById("qrForm").hidden = true;
    document.querySelector(".back").hidden = true;
    document.getElementById("status").innerText =
        "Loading your dynamic attendance QR...";
    generateQR(currentStudentId, currentEventId, true);
} else if (qrLinkParams.has("studentId") || qrLinkParams.has("eventId")) {
    document.getElementById("qrForm").hidden = true;
    document.querySelector(".back").hidden = true;
    document.getElementById("status").innerText =
        "This attendance QR link is incomplete. Contact the event organizer.";
    document.getElementById("timer").innerText =
        "Unable to generate an attendance QR.";
} else {
    loadRoster();
}

async function loadRoster() {
    const status = document.getElementById("status");

    try {
        const response = await fetch("/api/roster");
        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.error || "Could not load the Google Sheets roster.");
        }

        const studentOptions = document.getElementById("studentOptions");
        const eventOptions = document.getElementById("eventOptions");

        studentOptions.replaceChildren(...data.students.map((student) =>
            new Option(`${student.studentId} - ${student.name || "Student"}`, student.studentId)
        ));
        eventOptions.replaceChildren(...data.events.map((event) =>
            new Option(`${event.eventId} - ${event.name}`, event.eventId)
        ));

        const emailSync = data.emailSync || {};
        status.innerText = [
            "Roster loaded from Google Sheets.",
            `Dynamic QR links emailed: ${emailSync.sent || 0}.`,
            `Already sent: ${emailSync.alreadySent || 0}.`,
            `Currently sending: ${emailSync.pending || 0}.`,
            `Missing email: ${emailSync.missingEmail || 0}.`,
            `Email failures: ${emailSync.failed || 0}.`
        ].join(" ");
    } catch (error) {
        console.error("Roster loading failed:", error);
        status.innerText = error.message;
    }
}

async function generateQR(studentId, eventId, syncRoster) {
    const thisGeneration = ++generationId;
    const qrImage = document.getElementById("qrImage");

    try {
        clearInterval(timerInterval);
        qrImage.hidden = true;
        qrImage.removeAttribute("src");
        document.getElementById("status").innerText =
            "Generating secure QR...";
        document.getElementById("timer").innerText =
            "Please wait while a new QR is generated.";

        const response = await fetch("/api/qr/generate", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                studentId,
                eventId,
                syncRoster
            })
        });

        let data;
        try {
            data = await response.json();
        } catch (error) {
            throw new Error("The server returned an invalid response.");
        }

        if (!response.ok || !data.success) {
            throw new Error(data.error || "QR generation failed");
        }

        if (
            typeof data.qrCode !== "string" ||
            !data.qrCode.startsWith("data:image/png;base64,") ||
            !Number.isSafeInteger(data.expiresAt) ||
            data.expiresAt <= Date.now()
        ) {
            throw new Error("The server returned an invalid or expired QR code.");
        }

        const imageReady = new Promise((resolve, reject) => {
            const generatedImage = new Image();
            generatedImage.onload = resolve;
            generatedImage.onerror = () => reject(
                new Error("Chrome could not load the generated QR image.")
            );
            generatedImage.src = data.qrCode;
        });
        await imageReady;

        if (thisGeneration !== generationId) {
            return;
        }

        qrImage.src = data.qrCode;
        qrImage.hidden = false;

        document.getElementById("status").innerText =
            "QR Active - Scan Now";

        startTimer(data.expiresAt);

    } catch (error) {
        if (thisGeneration === generationId) {
            console.error("QR generation failed:", error);
            document.getElementById("status").innerText = error.message;
            document.getElementById("timer").innerText =
                "Use Generate QR to try again.";
        }
    }
}


function startTimer(expiresAt) {

    timerInterval = setInterval(() => {

        const remaining =
            Math.max(
                0,
                Math.ceil(
                    (expiresAt - Date.now()) / 1000
                )
            );

        document.getElementById("timer").innerText =
            "QR expires in " + remaining + " seconds";

        if (remaining <= 0) {

            clearInterval(timerInterval);

            document.getElementById("timer").innerText =
                "QR expired — generating new QR...";

            document.getElementById("status").innerText =
                "Refreshing secure QR...";

            generateQR(currentStudentId, currentEventId, false);
        }

    }, 1000);
}

</script>

</body>
</html>
